[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scarce"
version = "0.2.0"
description = "Measure which architecture actually helps on your low-data problem, instead of assuming one does."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aryan Bhattacharya" }]
keywords = ["low-data", "data-efficiency", "few-shot", "sparse-activations", "model-selection", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately minimal. The statistics are implemented in `scarce/stats.py`
# rather than pulled from scipy, so installing this does not drag in a
# scientific stack.
dependencies = [
    "torch>=1.13",
    "numpy>=1.21",
]

[project.optional-dependencies]
# Only the MNIST example and the research experiments need torchvision.
examples = ["torchvision>=0.14"]
# torchvision is a TEST dependency, not just an example one: tests/test_sampling
# and tests/test_cifar10 import data.mnist_v2 / data.cifar10, which import
# torchvision at module load (even though the tests themselves use synthetic
# tensors and never download). Without it here, `pip install .[dev] && pytest`
# fails at collection on any machine lacking a global torchvision -- which is
# exactly how the first CI run failed.
dev = ["pytest>=7", "torchvision>=0.14"]

[project.urls]
Homepage = "https://github.com/aryanb1324/scarce"
Source = "https://github.com/aryanb1324/scarce"

[tool.setuptools]
# Install ONLY the scarce package tree. The mechanism modules it needs at runtime
# are vendored under scarce/_modules/ (byte-identical copies of the frozen
# architecture/modules/ originals, guarded by tests/test_packaging.py). Shipping
# `architecture` and `data` as top-level packages used to pollute the installing
# user's namespace with those very generic names; it no longer does.
packages = ["scarce", "scarce._modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
