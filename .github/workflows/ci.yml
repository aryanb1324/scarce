name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          # 3.9 is the project's target runtime; the code deliberately avoids
          # PEP 604/585 syntax so it imports here. Test the version we ship for.
          python-version: "3.9"

      - name: Install CPU-only torch
        # The default Linux torch wheel bundles CUDA (~2 GB). The CPU wheel is a
        # fraction of that and all these tests need -- they run on toy tensors.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + test deps
        run: pip install ".[dev]"

      - name: Run test suite
        # The suite uses synthetic tensors only -- no dataset downloads, no
        # network -- so it is deterministic on a clean runner.
        run: pytest -q
