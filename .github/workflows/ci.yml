name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          # 3.9 is the project's target runtime; the code deliberately avoids
          # PEP 604/585 syntax so it imports here. Test the version we ship for.
          python-version: "3.9"

      - name: Install CPU-only torch + torchvision
        # The default Linux torch wheel bundles CUDA (~2 GB); the CPU wheels are a
        # fraction of that and all these tests need (toy tensors only). BOTH must
        # come from the pytorch CPU index in the SAME command: torch from this
        # index + torchvision from PyPI are built against different torch and do
        # not interoperate ("operator torchvision::nms does not exist"). Pinning
        # both here means the later `.[dev]` install sees torchvision already
        # satisfied and does not pull a mismatched PyPI build.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + test deps
        run: pip install ".[dev]"

      - name: Run test suite
        # The suite uses synthetic tensors only -- no dataset downloads, no
        # network -- so it is deterministic on a clean runner.
        run: pytest -q
