name: publish

# Publishes to PyPI when a GitHub Release is published, using Trusted Publishing
# (OpenID Connect) -- no API token is stored anywhere. PyPI verifies the request
# came from this exact repo + workflow + environment via a short-lived OIDC token.
#
# The matching trusted-publisher config on PyPI must be:
#   Owner=aryanb1324  Repository=scarce  Workflow=publish.yml  Environment=pypi
#
# Versions on PyPI are immutable: bump `version` in pyproject.toml before each
# release, or the publish step fails on a duplicate.

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the "Environment name" in the PyPI trusted-publisher config.
    environment: pypi
    permissions:
      # Required for Trusted Publishing (OIDC). Scoped to this job only.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
